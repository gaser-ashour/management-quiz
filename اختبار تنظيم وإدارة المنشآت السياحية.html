<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار تنظيم وإدارة المنشآت السياحية</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#5b6478;--bd:#d9deea;--pr:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1424;--card:#1a2138;--tx:#e8ecf7;--mut:#9aa5c0;--bd:#2c3556;--pr:#7c96ff;--ok:#5fd07a;--okb:#16301f;--no:#ff7b7b;--nob:#3a1b1f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1424;--card:#1a2138;--tx:#e8ecf7;--mut:#9aa5c0;--bd:#2c3556;--pr:#7c96ff;--ok:#5fd07a;--okb:#16301f;--no:#ff7b7b;--nob:#3a1b1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;align-items:center;gap:10px}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--bd)}.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem}
.lbl{font-size:.8rem;color:var(--mut)}.big{font-weight:700;font-size:1.05rem}
#wbox{margin-inline-start:auto;border:1px solid var(--no);background:var(--nob);color:var(--no);border-radius:12px;padding:8px 14px;cursor:pointer;font:inherit;text-align:center}
#wbox b{display:block;font-size:1.3rem;line-height:1.2}
main{max-width:760px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:1.25rem;margin:14px 0 4px}
.sep{display:flex;align-items:center;gap:10px;margin:36px 0 16px;color:var(--mut);font-size:.88rem;font-weight:600}.sep::before,.sep::after{content:'';flex:1;border-top:2px dashed var(--bd)}h2{font-size:1.05rem;color:var(--pr);margin:26px 0 8px;border-bottom:2px solid var(--bd);padding-bottom:4px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0;scroll-margin-top:calc(110px + env(safe-area-inset-top,0px))}
.q.flash{animation:fl 1.6s}@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--pr)}100%{box-shadow:none}}
.meta{font-size:.78rem;color:var(--mut);margin-bottom:4px}
.qt{font-weight:600;margin-bottom:10px}
.op{display:flex;gap:10px;width:100%;text-align:start;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--pr)}.op:disabled{cursor:default}
.op b{color:var(--pr)}
.op.ok{background:var(--okb);border-color:var(--ok)}.op.no{background:var(--nob);border-color:var(--no)}
.fb{display:none;margin-top:8px;padding:9px 12px;border-radius:10px;font-size:.92rem}
.fb.ok{display:block;background:var(--okb);color:var(--ok)}.fb.no{display:block;background:var(--nob)}
.fb.no strong{color:var(--no)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.md{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:16px;border:1px solid var(--bd)}
.md h3{margin:0 0 10px}.md button.it{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer}
.md button.it:hover{border-color:var(--pr)}
.tag{font-size:.75rem;border-radius:8px;padding:1px 8px;margin-inline-end:6px;background:var(--nob);color:var(--no)}.tag.m{background:var(--bd);color:var(--mut)}
.x{float:left;border:0;background:none;color:var(--mut);font-size:1.4rem;cursor:pointer}
</style>
</head>
<body>
<header>
 <div class="meter"><div class="ring"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="fg" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"/></svg><b id="rt">0%</b></div>
 <div><div class="big" id="sc">0 / 0</div><div class="lbl">إجابات صحيحة</div><div class="lbl" id="st"></div></div></div>
 <button id="wbox" type="button"><b id="wn">0</b><span class="lbl">أخطاء / لم تُجَب</span></button>
</header>
<main>
 <h1>اختبار تنظيم وإدارة المنشآت السياحية</h1>
 <div class="lbl">الفرقة الثالثة · الفصلان الأول والثاني · لا يمكن تعديل الإجابة بعد اختيارها</div>
 <div id="qs"></div>
</main>
<div class="ov" id="ov"><div class="md" role="dialog" aria-modal="true"><button class="x" id="cl" aria-label="إغلاق">×</button><h3>الأسئلة الخاطئة أو التي لم تُجَب</h3><div id="wl"></div></div></div>
<script>
const L=["الفصل الأول: مدخل إلى تنظيم وإدارة المنشآت السياحية","الفصل الثاني: تطور الفكر الإداري والكفاءة والفعالية الإدارية"];
// [فصل، نوع(m/t)، السؤال، الخيارات، رقم الإجابة، التفسير]
const Q=[
[0,"m","تفترض شركة أن عميلها يشتري «مقعدًا في حافلة» بوصفه غاية في ذاته. أي فكرة من تعريف المنشأة السياحية تتجاهلها؟",["المنشأة تقدم قيمة للعميل","المنشأة تعمل ضمن شبكة","المنشأة تستخدم موارد محدودة","للمنشأة أهداف متعددة"],0,"العميل يشتري وسيلة للوصول بأمان وفي الوقت المناسب إلى تجربة يرغب فيها، لا المقعد نفسه؛ فالمنفعة المنتظرة هي جوهر القيمة."],
[0,"m","انطلقت رحلة وبقيت فيها عشرة مقاعد شاغرة، ولا يمكن بيعها بعد أسبوع. أي خاصية تفسر ذلك مباشرة؟",["عدم ملموسية الخدمة","عدم إمكانية تخزين الطاقة غير المباعة","تفاوت مستوى الخدمة","الحساسية للأزمات"],1,"مقاعد يوم معين طاقة تضيع بانتهاء اليوم ولا تُخزَّن، وكذلك وقت المرشد أو المركبة غير المستغل."],
[0,"m","وقع خطأ من المرشد أثناء الشرح، ولا تستطيع الشركة سحب الخدمة وإعادة إنتاجها كما تفعل مع سلعة معيبة. ما الخاصية المفسرة؟",["الموسمية","ترابط مقدمي الخدمة","تزامن تقديم الخدمة واستهلاكها","عدم ملموسية الخدمة"],2,"العميل يستهلك الخدمة أثناء تقديمها، فيمكن معالجة الأثر أو التعويض لكن التجربة الأصلية حدثت بالفعل."],
[0,"m","منظم رحلات يجمع النقل والزيارة والإرشاد والوجبات في منتج واحد. أين تظهر أهمية إدارته أكثر من غيرها؟",["في تخفيض سعر كل خدمة منفردة","في التنسيق بين المكونات لأن توقيت كل خدمة يؤثر في الأخرى","في استبدال الموردين دوريًا","في تحويل الخدمة إلى سلعة ملموسة"],1,"قيمة المنظم في ربط الخدمات المتعددة؛ فتأخر حلقة واحدة يعطل ما بعدها."],
[0,"m","هدف الشركة أن تبدأ 95٪ من رحلاتها في موعدها، لكن النتيجة 80٪. وفق مفهوم الرقابة، ما الخطوة الأكمل؟",["تسجيل الفرق في التقرير ثم الانتقال لفترة جديدة","خفض الهدف إلى 80٪","البحث عن سبب الفرق ثم اتخاذ إجراء وقياس أثره","محاسبة المرشدين مباشرة"],2,"الرقابة ليست تسجيل الفرق فقط؛ بل تحليل أسبابه (نقطة تجمع غير واضحة، مورد متأخر، بطء التسجيل) ثم الإجراء وقياس الأثر."],
[0,"m","أي حالة تمثل «فعالية» وليست «كفاءة» فقط؟",["خفض وقت تسجيل المشاركين","تقليل هدر الوقود دون المساس بالسلامة","تصميم خدمة يحتاجها العملاء فعلًا وتحقق غرض المنشأة","دمج نموذجين متشابهين في نموذج واحد"],2,"الفعالية = تحقيق الهدف المناسب؛ أما الكفاءة فتخص حسن استخدام الموارد وتقليل الهدر."],
[0,"m","اعتماد شركة سياحة على مورد نقل واحد فقط، كيف يُصنَّف في تحليل SWOT؟",["تهديد لأنه يتعلق بالموردين","نقطة ضعف لأنه عامل داخلي يمكن علاجه","فرصة لأنه يبسط التعامل","نقطة قوة لأنه يخفض التكلفة"],1,"الاعتماد على مورد واحد وضع داخلي تستطيع المنشأة تغييره؛ أما ارتفاع تكاليف الموردين نفسه فتهديد خارجي."],
[0,"t","تعني «الجودة» في شركات النقل السياحي نظافة المركبة فقط.",null,1,"تشمل الجودة السلامة وملاءمة السعة لعدد المشاركين ووضوح نقطة الالتقاء وسلوك السائق."],
[0,"t","تستطيع المنشأة السياحية التحكم مباشرة في البيئة الخارجية كالمنافسين والتغيرات الاقتصادية.",null,1,"لا تتحكم فيها مباشرة، لكنها تستطيع رصدها والاستعداد لها والتكيف معها."],
[0,"t","يحتاج التنظيم الجيد إلى قدر من المرونة رغم وجود إجراءات ثابتة.",null,0,"الإجراءات الثابتة تمنع الأخطاء المتكررة، لكن على العاملين معرفة التصرف في حالة لا يغطيها الإجراء المعتاد."],
[0,"t","يكفي تحقيق الربح وحده لضمان استمرار المنشأة السياحية.",null,1,"الربح ضروري لكنه لا يكفي؛ فعليها أيضًا حماية رضا العملاء وسمعتها وسلامة العاملين والزوار وعلاقاتها بالموردين والمجتمع."],
[0,"t","قد تكشف مراجعات العملاء السلبية المتكررة على المنصات الرقمية مشكلة تشغيلية حقيقية.",null,0,"التكرار يدل على نمط تشغيلي لا على حالة فردية، وتجارب العملاء تنتشر عبر المنصات."],
[0,"m","مركز أنشطة بحرية يتجاوز عدد زواره في موسم الذروة ما يحتمله المكان. أي جانب إداري تزداد أهميته في هذا النوع من المنشآت؟",["رفع عدد الحجوزات بلا سقف","الاكتفاء بالتسويق للفئات الجديدة","تقليل عدد العاملين لخفض التكلفة","إدارة الطاقة الاستيعابية وسلامة الزوار وحماية المورد الذي تقوم عليه التجربة"],3,"في المنشآت الثقافية والترفيهية والبحرية تزداد أهمية الطاقة الاستيعابية وسلامة الزوار وحماية المكان أو المورد الذي تقوم عليه التجربة."],
[0,"m","منصة سياحية رقمية تعرض توافرًا وأسعارًا غير محدّثة، ويشكو عملاء من غموض شروط الخدمة ولا توجد آلية لحل خلافاتهم مع مقدمي الخدمة. أي متطلب إداري أُهمل؟",["معلومات دقيقة ومحدثة ونظام يوضح التوافر والأسعار والشروط وآلية فعالة لمعالجة المشكلات","الاعتماد على قناة واحدة للحجز","زيادة عدد المرشدين","توسيع الطاقة الاستيعابية للمواقع"],0,"إدارة المنصات الرقمية تحتاج معلومات دقيقة ومحدثة، ووضوحًا في التوافر والأسعار والشروط، وحماية بيانات العملاء، وآلية لمعالجة المشكلات بين العميل ومقدم الخدمة."],
[0,"m","مؤتمر تميّز فيه المكان والضيافة والتجهيزات التقنية كلٌّ على حدة، لكنه فشل لتعارض توقيتاتها. أي سمة لمنشآت الفعاليات تفسر ذلك؟",["اعتمادها على موقع مفتوح للزيارة","اعتمادها على وسيط واحد","إدارتها عددًا كبيرًا من التفاصيل التي يجب أن تجتمع في وقت واحد، فتحتاج تخطيطًا دقيقًا وتجربة مسبقة وتحديدًا للمسؤوليات","تركيزها على النقل فقط"],2,"جودة العناصر منفردة لا تكفي؛ فالنجاح في اجتماعها المتزامن، ولذلك تعتمد هذه المنشآت على التخطيط الدقيق والتجربة المسبقة."],
[0,"m","تأخر الفندق الشريك في تسليم الغرف فتعطل برنامج اليوم لدى المنظم رغم كفاءة المرشد. أي خاصية تفسر الموقف بدقة؟",["الاعتماد على العنصر البشري","ترابط مقدمي الخدمة","عدم ملموسية الخدمة","الموسمية"],1,"الرحلة سلسلة خدمات؛ وضعف حلقة واحدة (الفندق) يؤثر في النتيجة النهائية مهما كانت الحلقات الأخرى جيدة."],
[0,"m","ما الفرق الجوهري بين «الموسمية» و«الحساسية للأزمات»؟",["لا فرق بينهما","الموسمية تخص الموردين والأزمات تخص العملاء","الموسمية تؤثر في الإيرادات فقط","الموسمية ارتفاع وانخفاض للطلب مرتبط بفترات من السنة، أما الأزمات فتغيّر سريع في الطلب بسبب ظروف صحية أو اقتصادية أو بيئية أو أحداث تؤثر في السفر"],3,"الموسمية نمط مرتبط بالإجازات والمناسبات ويؤثر في الإيرادات والعمالة والسيولة والموردين والأسعار؛ أما الأزمات فتغير الطلب بسرعة."],
[0,"m","أي عنصر مما يأتي يندرج ضمن البيئة الداخلية للمنشأة؟",["دخول منافسين جدد","ارتفاع تكاليف الموردين","سمعتها المتراكمة لدى عملائها وجودة إجراءاتها","تغير تفضيلات العملاء"],2,"البيئة الداخلية ما تملكه المنشأة أو تؤثر فيه نسبيًا بصورة مباشرة: مهارات العاملين، الموارد، الهيكل، الثقافة، الأنظمة، الإجراءات، السمعة."],
[0,"m","لا يعرف مرشد من يعتمد قرار تغيير المسار ولا من يتدخل عند ظهور مشكلة. أي أسئلة التنظيم لم تُحسم؟",["من يعتمد القرار؟ ومن يتدخل عند المشكلة؟","ما الأعمال المطلوبة؟ ومن يؤدي كل عمل؟","كيف تنتقل المعلومات فقط؟","ما الأعمال المطلوبة فقط؟"],0,"يجيب التنظيم عن خمسة أسئلة؛ والغموض هنا في صاحب اعتماد القرار ومن يتدخل عند المشكلة."],
[0,"m","تريد شركة زيادة الطلب على الرحلات الثقافية. أي خطوة تعبّر عن «التخطيط» وليست «الرقابة»؟",["مقارنة نسبة الرحلات المنطلقة في موعدها بالمستهدف","البحث عن سبب تأخر المورد","تحديد الشريحة المستهدفة والمنتج المناسب والطاقة المتاحة والميزانية ومؤشر النجاح","الاستماع لملاحظات المرشدين اليومية"],2,"التخطيط يحدد ما نريد تحقيقه ولماذا وكيف ومتى وبأي موارد، ويشمل مؤشر النجاح مسبقًا."],
[0,"t","تؤدي شركات السياحة ووكالات السفر دور الوسيط بين العميل ومقدم الخدمة في كل الحالات دون استثناء.",null,1,"قد تؤدي دور الوسيط، أو تقدم خدمات أوسع بحسب طبيعة نشاطها."],
[0,"t","يتحدد نجاح المنشأة السياحية بعدد عامليها وحده.",null,1,"يرتبط النجاح باختيار العاملين وتدريبهم وتحفيزهم وتحديد مسؤولياتهم، لا بعددهم وحده."],
[0,"t","في تحليل SWOT، يُعد ظهور قناة توزيع مناسبة فرصة لأنه ظرف خارجي قد تستفيد منه المنشأة إذا استعدت له.",null,0,"الفرص ظروف خارجية؛ أما نقاط القوة والضعف فعوامل داخلية."],
[0,"t","في مثال شركة الإسكندرية للرحلات الثقافية، يُصنَّف ارتفاع تكلفة النقل نقطة ضعف.",null,1,"هو تهديد خارجي؛ أما نقطة الضعف فهي الاعتماد على مورد نقل واحد."],
[0,"t","قد تكون المنشأة كفؤة وغير فعالة في الوقت نفسه، كأن توفر الموارد في تقديم خدمة لا يحتاجها العملاء.",null,0,"الكفاءة تخص حسن استخدام الموارد، والفعالية تخص تحقيق الهدف المناسب؛ فلا يلزم أن تتحققا معًا."],
[0,`m`,`تقرر شركة تسيير عدد رحلات يفوق ما تتيحه مركباتها وعاملوها وميزانيتها، ثم تخفض مستوى الخدمة والسلامة لتغطيتها. أي فكرة من تعريف المنشأة السياحية تُهمَل؟`,[`المنشأة تعمل ضمن شبكة`,`المنشأة تستخدم موارد محدودة، ومن مهام الإدارة استخدامها دون هدر مع الحفاظ على مستوى الخدمة والسلامة`,`المنشأة تقدم قيمة للعميل`,`للمنشأة أهداف متعددة`],1,`الموارد (عاملون، مركبات، ميزانية، وقت، طاقة استيعابية) محدودة؛ والمطلوب استخدامها دون هدر لا على حساب الخدمة والسلامة.`],
[0,`m`,`يقدم موظف شرحًا ممتازًا يوم الأحد وشرحًا ضعيفًا يوم الخميس تحت ضغط العمل. أي خاصية تفسر ذلك؟`,[`تفاوت مستوى الخدمة`,`تزامن تقديم الخدمة واستهلاكها`,`الموسمية`,`عدم ملموسية الخدمة`],0,`قد يختلف الأداء من موظف لآخر ومن يوم لآخر لدى الموظف نفسه، ويتأثر بالخبرة والتدريب وضغط العمل ووضوح الإجراءات وطبيعة العميل والموقف.`],
[0,`m`,`أي مما يأتي لا يدخل في معنى «الجودة» في شركات النقل السياحي وفق المحاضرة؟`,[`السلامة`,`ملاءمة السعة لعدد المشاركين`,`وضوح نقطة الالتقاء وسلوك السائق`,`فخامة تصميم الإعلانات`],3,`الجودة هنا تشمل السلامة والسعة ونقطة الالتقاء وسلوك السائق، لا نظافة المركبة وحدها ولا الإعلان.`],
[0,`m`,`أي منشأة تظهر أهميتها في ربط النقل والزيارة والإرشاد والإقامة في منتج واحد يتوقف نجاحه على تنسيق توقيتاتها؟`,[`شركة النقل السياحي`,`المنصة السياحية الرقمية`,`منظم الرحلات`,`منشأة الفعاليات`],2,`منظم الرحلات يصمم برنامجًا يجمع خدمات متعددة، وتظهر أهميته في التنسيق بينها لأن توقيت كل خدمة يؤثر في الأخرى.`],
[0,`m`,`يشرح مدير المطلوب لفريقه وينسق بينهم ويحفزهم ويعالج مشكلاتهم اليومية، ويصغي لملاحظات المرشدين وموظفي خدمة العملاء. أي وظيفة إدارية يمارس؟`,[`التخطيط`,`التنظيم`,`الرقابة`,`التوجيه`],3,`يشمل التوجيه الاستماع للملاحظات القادمة من الصفوف الأمامية لأنها قد تكشف تغيرًا في احتياجات العملاء قبل ظهوره في التقارير.`],
[0,`m`,`وضعت الإدارة خطة لزيادة الرحلات الثقافية لكنها لم تحدد من ينفذ كل جزء منها. أي وظيفة إدارية ناقصة؟`,[`التنظيم، لأنه يحوّل الخطة إلى عمل موزع بين مسؤولين محددين`,`التخطيط`,`الرقابة`,`التوجيه`],0,`الخطة موجودة؛ المفقود توزيع العمل على مسؤولين محددين وهو جوهر التنظيم.`],
[0,`m`,`لدى منشأة وصف واضح للوظائف وتوازن بين المسؤولية والصلاحية، لكن الأقسام لا تعرف كيف تنسق عند تعارض المواعيد. أي عنصر من عناصر التنظيم الجيد ناقص؟`,[`وصف واضح للوظائف`,`توازن بين المسؤولية والصلاحية`,`نقاط تنسيق بين الأقسام`,`زيادة عدد الموظفين`],2,`من عناصر التنظيم الجيد: وصف الوظائف، وتوازن المسؤولية والصلاحية، وقنوات اتصال معلومة، ونقاط تنسيق بين الأقسام، مع قدر من المرونة.`],
[0,`m`,`أي تصنيف صحيح وفق تحليل SWOT؟`,[`الاعتماد على موظف واحد يعرف كل الحجوزات: تهديد، وتعرض موقع تعتمد عليه البرامج للإغلاق المؤقت: ضعف`,`الاعتماد على موظف واحد: فرصة، وتغير تفضيلات العملاء لصالح برامج قصيرة: ضعف`,`الاعتماد على موظف واحد يعرف كل الحجوزات: ضعف، وتعرض موقع تعتمد عليه البرامج للإغلاق المؤقت: تهديد`,`كلاهما نقطة ضعف لأن كليهما يضر بالمنشأة`],2,`المعيار هو طبيعة العامل لا أثره فقط: داخلي (قوة/ضعف) أو خارجي (فرصة/تهديد). الاعتماد على موظف واحد داخلي فهو ضعف، وإغلاق الموقع ظرف خارجي فهو تهديد.`],
[0,`t`,`يستطيع العميل معاينة الرحلة كاملة قبل شرائها، ولذلك تُعد الخدمة السياحية ملموسة.`,null,1,`الخدمة غير ملموسة: لا يستطيع العميل معاينة الرحلة كاملة قبل شرائها.`],
[0,`t`,`تعني الرقابة تسجيل الفرق بين الأداء الفعلي والمخطط فقط.`,null,1,`تتضمن الرقابة البحث عن سبب الفرق ثم اتخاذ إجراء وقياس أثره.`],
[0,`t`,`تُعد سمعة المنشأة المتراكمة وجودة إجراءاتها من عناصر البيئة الخارجية.`,null,1,`هي من البيئة الداخلية؛ أما الخارجية فتشمل العملاء والمنافسين والموردين والتغيرات الاقتصادية والتقنية والاجتماعية والبيئية والجهات المنظمة.`],
[0,`t`,`تؤثر الموسمية في الإيرادات والعمالة والسيولة وتوافر الموردين والأسعار.`,null,0,`ارتفاع الطلب في فترات وانخفاضه في أخرى ينعكس على هذه الجوانب كلها.`],
[0,`t`,`يمكن للمنشأة الاستغناء عن تحقيق الربح ما دامت تحافظ على رضا عملائها وسمعتها.`,null,1,`الربح ضروري للاستمرار لكنه لا يكفي وحده؛ فالأهداف متعددة ولا يُستغنى عن أحدها.`],
[0,`m`,`في مثال شركة الإسكندرية للرحلات الثقافية، أي زوج يمثل بالترتيب (نقطة قوة، فرصة)؟`,[`تقييمات إيجابية لجودة الإرشاد؛ ارتفاع تكلفة النقل`,`تأخر تأكيد بعض الحجوزات؛ اهتمام محتمل ببرامج قصيرة ومتخصصة`,`الاعتماد على مورد نقل واحد؛ منافسة على البرامج المتشابهة`,`مرشدون لديهم معرفة جيدة بالآثار وقدرة على الشرح؛ إمكانية تطوير قناة حجز مباشرة`],3,`القوة والضعف داخليان، والفرصة والتهديد خارجيان. الخيار الأول يجمع قوة مع تهديد، والثاني ضعفًا مع فرصة، والثالث ضعفًا مع تهديد.`],
[0,`m`,`تصل حجوزات كثيرة لشركة عبر منصة خارجية واحدة، وتتزايد استفسارات عن برامج ثقافية قصيرة، ويشكو بعض العملاء من تأخر بداية الرحلات. أي تحليل أدق؟`,[`الحجوزات عبر منصة واحدة فرصة، وتأخر البداية تهديد`,`تزايد الاستفسارات نقطة قوة، وتأخر البداية فرصة`,`تأخر بداية الرحلات نقطة ضعف داخلية يمكن علاجها، وتزايد الاستفسارات عن البرامج القصيرة فرصة خارجية`,`العناصر الثلاثة كلها تهديدات خارجية`],2,`ما يمكن للمنشأة العمل على علاجه ضعف داخلي (التأخر)، وما يأتي من تفضيلات السوق فرصة خارجية إذا استعدت له.`],
[0,`m`,`أي موقف يمثل «عدم إمكانية تخزين الطاقة غير المباعة» لدى منظم رحلات؟`,[`بقاء مقاعد شاغرة في رحلة انطلقت اليوم، وبقاء مرشد أو مركبة بلا استغلال في يوم لا رحلات فيه`,`شكوى عميل من غموض البرنامج`,`ارتفاع الطلب في الإجازات وانخفاضه بعدها`,`اختلاف أداء مرشدين مختلفين`],0,`المقاعد والوقت غير المستغل يضيعان بانتهاء اليوم ولا يمكن بيعهما لاحقًا؛ فهما فرصة ضائعة.`],
[0,`m`,`أي عبارة تعرّف «التنظيم» وفق المحاضرة؟`,[`مقارنة الأداء الفعلي بما خُطِّط له والبحث عن أسباب الفرق`,`تحديد ما تريد المنشأة تحقيقه ولماذا وكيف ومتى وبأي موارد`,`تحديد الأعمال اللازمة لتحقيق الأهداف وتجميع المتشابه منها وتوزيعها على أفراد وأقسام مع تحديد الصلاحيات والمسؤوليات والعلاقات`,`شرح المطلوب للعاملين وتحفيزهم ومعالجة مشكلاتهم اليومية`],2,`الخيار الأول للرقابة، والثاني للتخطيط، والرابع للتوجيه.`],
[0,`m`,`تكتشف الإدارة عند الرقابة أن الأداء أقل من المخطط، فتعدل الخطة وتعيد توزيع المسؤوليات. ماذا يوضح ذلك عن الإدارة؟`,[`أنها قرار يتخذه المدير الأعلى مرة واحدة`,`أنها عملية مستمرة تتداخل فيها وظائف التخطيط والتنظيم والتوجيه والرقابة لتحقيق الأهداف بفعالية وكفاءة`,`أن الرقابة تُلغي الحاجة إلى التخطيط`,`أن التنظيم مسؤولية الإدارة الإشرافية وحدها`],1,`الإدارة عملية مستمرة تشمل التخطيط والتنظيم والتوجيه والرقابة على موارد المنشأة.`],
[0,`m`,`أي وصف يطابق شركات السياحة ووكالات السفر؟`,[`تصمم برنامجًا متكاملًا يجمع كل الخدمات في منتج واحد دائمًا`,`تركز على توفير وسيلة نقل آمنة في الموعد`,`تدير فعاليات ومؤتمرات ومعارض بتفاصيل متزامنة`,`تساعد العميل في الوصول إلى تذاكر النقل والإقامة والبرامج، وقد تؤدي دور الوسيط أو تقدم خدمات أوسع بحسب طبيعة نشاطها`],3,`الخيار الأول لمنظم الرحلات، والثاني لشركات النقل السياحي، والثالث لمنشآت الفعاليات.`],
[0,`m`,`سجلت منشأة أقل تكلفة تشغيل لرحلاتها، لكن البرنامج المعروض لا يحتاجه العملاء ولا يحقق غرض المنشأة. كيف يوصف الوضع؟`,[`فعالية عالية وكفاءة منخفضة`,`كفاءة في استخدام الموارد دون فعالية في تحقيق الهدف المناسب`,`كفاءة وفعالية معًا`,`لا كفاءة ولا فعالية لأن التكلفة منخفضة`],1,`الكفاءة تخص حسن استخدام الموارد، والفعالية تخص تقديم خدمة يحتاجها العملاء وتحقق غرض المنشأة.`],
[0,`t`,`يُصنَّف تأخر تأكيد بعض الحجوزات ونقاط التجمع في مثال شركة الإسكندرية نقطة ضعف داخلية.`,null,0,`هو قصور داخلي في الأداء يمكن العمل على علاجه.`],
[0,`t`,`يُجرى تحليل SWOT بعد وضع الخطة واتخاذ القرار ليقيّم نتائجهما.`,null,1,`يساعد التحليل الإدارة على تشخيص وضع المنشأة قبل وضع خطة أو اتخاذ قرار.`],
[0,`t`,`تحتاج إدارة المنصات السياحية الرقمية إلى حماية بيانات العملاء إلى جانب معلومات دقيقة ومحدثة.`,null,0,`وكذلك نظام يوضح التوافر والأسعار وشروط الخدمة وآلية لمعالجة المشكلات.`],
[0,`t`,`يكفي في التنظيم الجيد وصف واضح للوظائف دون حاجة إلى قنوات اتصال أو نقاط تنسيق بين الأقسام.`,null,1,`يتطلب التنظيم الجيد أيضًا توازنًا بين المسؤولية والصلاحية وقنوات اتصال معلومة ونقاط تنسيق ومرونة.`],
[0,`t`,`وفق تعريف المنشأة السياحية، تحقق المنشأة أهدافها ضمن القواعد التي تنظم نشاطها.`,null,0,`ورد ذلك في التعريف إلى جانب تنظيم الموارد البشرية والمالية والتقنية والعلاقات مع الشركاء.`],
[1,"m","يكتب العميل بياناته في استمارة، ثم يعيد الموظف إدخالها، ثم يطلبها قسم التشغيل مرة ثالثة. ما الحل المنسجم مع الإدارة العلمية؟",["زيادة عدد الموظفين","نموذج واحد تُراجَع بياناته مرة واحدة وتتاح للأقسام وفق صلاحياتها","إلغاء مراجعة البيانات","تفويض كل قسم بجمع بياناته"],1,"الإدارة العلمية تدرس الخطوات والحركات التي لا تضيف قيمة وتزيل التكرار، فيقل الوقت والأخطاء."],
[1,"m","طُلب من مسؤول خدمة العملاء حل أي شكوى فورًا، لكنه لا يملك صلاحية التعويض ولا يعرف متى يصعّد الحالة. أي مبدأ أُخلّ به؟",["وحدة الأمر","تقسيم العمل","توازن السلطة والمسؤولية","العدالة"],2,"لا يجوز تحميل موظف نتيجة لا يملك صلاحية التأثير فيها؛ يلزم منحه صلاحيات محددة ومعرفة حالات التصعيد."],
[1,"m","يحتاج تعديل بسيط في برنامج الرحلة إلى سلسلة طويلة من الموافقات فيتأخر القرار حتى يفقد قيمته. ما التشخيص والعلاج الأنسب؟",["غياب القواعد؛ ينبغي إلغاء التوثيق","الإفراط في الإجراءات؛ تحديد القرارات التي تستلزم موافقة عليا وتفويض غيرها بضوابط واضحة","ضعف الرقابة؛ زيادة التقارير","ضعف الدافعية؛ رفع الحوافز"],1,"للبيروقراطية فائدة في منع العشوائية والمحسوبية، لكن الإفراط فيها يعطل القرار؛ والحل في التفويض المنضبط."],
[1,"m","مدير يسود فريقه جو لطيف، لكن الحجوزات غير دقيقة والرحلات تتأخر باستمرار. أي حد في مدرسة العلاقات الإنسانية يوضحه الموقف؟",["الاهتمام بالعلاقات لا يعني تجاهل النتائج","إهمال العلاقات يرفع الإنتاجية","التوثيق أهم من التقدير","الموظف مجرد منفذ لتعليمات"],0,"المدير الجيد يجمع بين معاملة عادلة للعاملين وتوقعات واضحة للأداء."],
[1,"m","يتخذ مدير قرارًا سريعًا بمفرده في طارئ، ويشرك فريقه في قرار جديد معقد ووقته متسع. كيف يفسر المدخل الموقفي ذلك؟",["تناقض يدل على ضعف المبادئ","الأسلوب يتغير بحسب الخطر والوقت وخبرة العاملين وطبيعة المهمة، بينما تبقى المبادئ كالسلامة والعدالة ثابتة","تطبيق للتنظيم البيروقراطي","تطبيق لمبدأ وحدة الأمر فقط"],1,"لا توجد طريقة واحدة تصلح لكل حالة؛ تتغير طريقة التطبيق ودرجة المشاركة وسرعة القرار، أما المبادئ فثوابت."],
[1,"m","ارتفعت زيارات صفحة برنامج سياحي وانخفضت حجوزاته. ما الاستنتاج الأدق وفق الإدارة القائمة على البيانات؟",["البرنامج ناجح لأن الزيارات مرتفعة","الرقم وحده لا يكفي؛ قد تكمن المشكلة في السعر أو وضوح الوصف أو خطوات الدفع وتحتاج تفسيرًا","يجب إلغاء البرنامج","الأمر يخص المنافسين فقط"],1,"البيانات تحتاج إلى تفسير؛ ولا تكفي مشاهدة الرقم وحده لمعرفة السبب."],
[1,"m","أي إجراء يخالف روح الإدارة الرشيقة؟",["حذف إدخال البيانات المكرر","تحسين انسياب العمل","حذف خطوة تحقق أساسية من سلامة الحجز لمجرد توفير دقيقة","إزالة الهدر"],2,"الرشاقة تزيل الهدر دون إضعاف القيمة التي يحصل عليها العميل؛ فلا تُحذف خطوة تحقق أساسية."],
[1,"t","ألغت الاتجاهات الحديثة في الإدارة الأفكار السابقة وحلّت محلها.",null,1,"لم تُلغِها، لكنها وسّعت مجال الإدارة وأدواتها."],
[1,"t","عندما يتفاوض مدير العمليات مع مورد نقل بديل على الشروط والتكلفة بعد تعذر الحافلة الأصلية، فهو يؤدي دور التفاوض.",null,0,"التفاوض أحد أدواره المتتابعة في الموقف بعد جمع المعلومات واتخاذ القرار وقبل الاتصال والمتابعة والتعلم."],
[1,"t","يعني المدخل الموقفي أن يغير المدير مبادئه من يوم إلى آخر.",null,1,"تظل السلامة والعدالة والصدق ثوابت، وتتغير طريقة التطبيق فقط."],
[1,"t","تحدد الإدارة الوسطى الاتجاه العام والاستثمارات الكبرى للمنشأة.",null,1,"ذلك للإدارة العليا؛ أما الوسطى فتحوّل الاتجاه إلى خطط وتنسق الموارد وتتابع النتائج."],
[1,"t","وفق مدخل النظم، ينبغي أن تتحول الشكاوى والتقييمات إلى مصدر للتعلم لا مجرد أرقام في تقرير.",null,0,"التغذية الراجعة تسأل: ما الشكوى المتكررة؟ ما سببها؟ ما الإجراء؟ وهل تحسنت النتيجة؟"],
[1,"m","يقترح زميل ألا ندرس المدارس الإدارية القديمة ما دامت الشركات تستخدم المنصات الرقمية والذكاء الاصطناعي. ما أقوى رد وفق المحاضرة؟",["صحيح، فالأدوات الجديدة تغني عن الأفكار القديمة","القديم أفضل دائمًا من الحديث","كثير من الأسئلة الإدارية قديمة في أصلها وإن تغيرت أدواتها، والدراسة تكشف سبب ظهور كل أسلوب والمشكلة التي حاول حلها وحدود استخدامه","الدراسة تفيد في حفظ التواريخ فقط"],2,"ما زلنا نحتاج إلى تحديد المسؤوليات وتحسين أداء العمل وتحفيز الموظفين والتنسيق بين الأقسام والاستجابة للبيئة."],
[1,"m","تقلّص إدارة وقت استماع الموظف لاحتياج العميل قبل الحجز بحجة أن الإدارة العلمية تهتم بالوقت والحركة. ما الخطأ في هذا التطبيق؟",["لا يجوز اختزال الخدمة السياحية في الوقت والحركة؛ فهذا الوقت قد يمنع اختيار برنامج غير مناسب ويقلل الشكاوى لاحقًا","الاستماع يزيد الأخطاء دائمًا","الإدارة العلمية لا تهتم بالوقت","المطلوب إلغاء الحجز المسبق"],0,"هذا هو الحد الذي يجب الانتباه إليه في الإدارة العلمية."],
[1,"m","يتلقى موظف حجوزات تعليمات متعارضة من مشرفين مختلفين في اليوم نفسه. أي مبدأ إداري أُخلّ به؟",["تقسيم العمل","وحدة الأمر","الانضباط","التنسيق"],1,"وحدة الأمر أن يعرف الموظف رئيسه المباشر ومن يملك إصدار التعليمات الملزمة له."],
[1,"m","يرى مدير أن «البيروقراطية» تعني البطء فقط، فيقرر إلغاء كل القواعد والتوثيق. ما الخطأ في ذلك؟",["لا خطأ، فالقواعد تعطل العمل دائمًا","التوثيق مطلوب للإدارات العليا فقط","التدرج في السلطة يلغي الحاجة للقواعد","للقواعد والتوثيق وظيفة مهمة إذ تمنع العشوائية والمحسوبية واختلاف المعاملة بين العملاء، والمشكلة في الإفراط"],3,"المطلوب تحديد القرارات التي تستلزم موافقة عليا وتلك التي تُفوَّض وفق ضوابط واضحة."],
[1,"m","تعالج منشأة كل شكوى فور وصولها دون السؤال عن سبب تكرارها. أي اتجاه حديث يوجه إلى تغيير هذا الأسلوب؟",["إدارة الجودة الشاملة","الإدارة الاستراتيجية","إدارة الابتكار","الإدارة الرشيقة"],0,"تبحث الجودة الشاملة عن أسباب الأخطاء المتكررة وتصحح العملية التي تنتجها، وتجعل التحسين مسؤولية مستمرة عبر الأقسام."],
[1,"m","بعد حل مشكلة الحافلة سأل المدير: لماذا تعطل المورد الأصلي، وهل يلزم تعديل العقد أو خطة البدائل؟ أي دور يؤديه؟",["جمع المعلومات","التفاوض","المتابعة","التعلم"],3,"التعلم آخر الأدوار المتتابعة؛ يحوّل الحادثة إلى تحسين للعقد وخطة البدائل."],
[1,"m","أي متغير مؤثر يرتبط بالسؤال الإداري: «ما الخدمات الحرجة، وما خطة الاتصال والبدائل؟»",["التغير المناخي","تغير سلوك المسافر","الأزمات الصحية والسياسية","المنافسة واتساع السوق"],2,"المتغيرات تُربط بأسئلة إدارية؛ وهذا السؤال خاص بالأزمات الصحية والسياسية."],
[1,"m","مدير يتحقق من مخرجات أداة ذكاء اصطناعي قبل اعتماد جدول الرحلات، ويحمي بيانات العملاء. أي مهارة يمارسها أساسًا؟",["المهارات الرقمية","المهارات الإنسانية","المهارات الفنية","إدارة الوقت"],0,"المهارات الرقمية تشمل استخدام الأنظمة وفهم البيانات وحماية المعلومات والتحقق من مخرجات الأدوات التقنية قبل اعتمادها."],
[1,"m","أي مما يأتي ليس من الأسئلة الأربعة قبل اختيار الأسلوب الإداري في المدخل الموقفي؟",["ما مستوى الخطر إذا تأخر القرار؟","كم لدينا من وقت للتحقق والمناقشة؟","ما خبرة المكلفين بالتنفيذ؟","كم سنة مضت على تأسيس المنشأة؟"],3,"الأسئلة الأربعة: الخطر، والوقت، وخبرة المكلفين، وهل المهمة متكررة واضحة أم جديدة معقدة."],
[1,"t","اهتمت المدرسة السلوكية بالدافعية والرضا الوظيفي والقيادة والاتصال وفرق العمل والصراع التنظيمي واتخاذ القرار.",null,0,"توسعت في دراسة سلوك الأفراد والجماعات داخل المؤسسة."],
[1,"t","تظهر آثار الإدارة الاستراتيجية في تنظيم رحلة واحدة أكثر من اختيار الأسواق والمنتجات والاستثمارات.",null,1,"أثرها في اتجاه المنشأة على المدى الأطول: العملاء المستهدفون والخدمات المتميزة والاستجابة للمنافسة، لا في رحلة واحدة فقط."],
[1,"t","تقتصر الإدارة المستدامة على النتائج الاقتصادية للنشاط.",null,1,"تنظر إلى أثر النشاط في البيئة والمجتمع إلى جانب نتائجه الاقتصادية."],
[1,"t","من صور المرونة وجود موردين بديلين وخطة اتصال وإجراءات للتعامل مع توقف نظام الحجز.",null,0,"المرونة قدرة المنشأة على الاستعداد للاضطرابات والحفاظ على خدماتها الأساسية والتعافي والتعلم بعدها."],
[1,"t","تعني المهارات الفنية للمدير الاستماع والتحفيز وإدارة الخلاف.",null,1,"تلك مهارات إنسانية؛ أما الفنية فتعني فهم طبيعة العمل وإجراءاته كالحجز وتصميم البرامج والتعامل مع الموردين."],
[1,`m`,`ركزت المدرسة الكلاسيكية على وضوح العمل والسلطة والقواعد والرقابة لتنظيم المؤسسات الكبيرة. أي مما يأتي يخرج عن اتجاهاتها الرئيسية الثلاثة؟`,[`الإدارة العلمية`,`المبادئ الإدارية`,`التنظيم البيروقراطي`,`مدرسة العلاقات الإنسانية`],3,`اتجاهاتها: الإدارة العلمية، والمبادئ الإدارية، والتنظيم البيروقراطي؛ أما العلاقات الإنسانية فمدرسة لاحقة لفتت الانتباه إلى أن الموظف ليس مجرد منفذ لتعليمات.`],
[1,`m`,`مدير يحوّل الاتجاه العام إلى خطط للفروع وينسق الموارد ويتابع النتائج، وآخر يقرر دخول سوق جديد، وثالث يعالج التأخير ويوزع المهام أثناء العمل. ما تصنيفهم على الترتيب؟`,[`عليا، وسطى، إشرافية`,`وسطى، إشرافية، عليا`,`وسطى، عليا، إشرافية`,`إشرافية، عليا، وسطى`],2,`الوسطى تترجم الاتجاه إلى خطط وتنسق وتتابع، والعليا تحدد الاتجاه والاستثمارات، والإشرافية تتابع التنفيذ اليومي.`],
[1,`m`,`أي مثال يُعد «مدخلات» في مدخل النظم لشركة سياحة؟`,[`الإيرادات والأرباح`,`العاملون والأموال ومعلومات العملاء والمركبات وأنظمة الحجز وخدمات الموردين`,`الشكاوى والتقييمات`,`تنفيذ الرحلات ومعالجة المشكلات`],1,`الإيرادات مخرجات، والشكاوى تغذية راجعة، وتنفيذ الرحلات عمليات.`],
[1,`m`,`أي توزيع صحيح لعناصر مدخل النظم؟`,[`تصميم البرامج: مدخلات، والإيرادات: عمليات، والشكاوى: مخرجات، وأنظمة الحجز: تغذية راجعة`,`الشكاوى: مدخلات، وتصميم البرامج: مخرجات، وأنظمة الحجز: عمليات، والإيرادات: تغذية راجعة`,`أنظمة الحجز: مدخلات، وتصميم البرامج: عمليات، والإيرادات: مخرجات، والشكاوى: تغذية راجعة`,`أنظمة الحجز: عمليات، وتصميم البرامج: مدخلات، والإيرادات: تغذية راجعة، والشكاوى: مخرجات`],2,`المدخلات (موارد)، العمليات (تصميم وحجز وتنفيذ ومعالجة)، المخرجات (تجربة العميل والإيرادات وأثر النشاط)، والتغذية الراجعة (شكاوى وتقييمات وتقارير وبيانات).`],
[1,`m`,`تتكرر شكوى من تأخر انطلاق رحلات المساء، فتسأل الإدارة: في أي رحلة وقناة؟ وهل السبب موظف أم إجراء أم مورد أم وعد غير دقيق؟ وما الإجراء المتخذ؟ وهل تحسنت النتيجة؟ ما الفكرة التي تطبقها؟`,[`جمع الشكاوى لعرضها في تقرير فقط`,`تحويل الشكاوى والتقييمات إلى مصدر للتعلم لا مجرد أرقام`,`تحميل الموظف مسؤولية كل شكوى`,`الاكتفاء بالرد على العميل`],1,`التغذية الراجعة لا تقتصر على معرفة أن العميل غير راضٍ، بل تتبع السبب والإجراء وأثره.`],
[1,`m`,`موقفان: تأخر حافلة قبل رحلة بعد دقائق مع مرشد خبير، ومهمة جديدة معقدة لفريق قليل الخبرة ووقته متسع. كيف يفسر المدخل الموقفي اختلاف الأسلوب الأنسب؟`,[`الأسلوب واحد في الموقفين تحقيقًا للعدالة`,`في الأول قرار أسرع ومشاركة أقل، وفي الثاني مشاركة وتحقق أوسع، مع بقاء السلامة والعدالة والصدق ثوابت`,`في الموقفين تُغيَّر المبادئ بحسب الظرف`,`الأسلوب الأنسب دائمًا هو الأسرع`],1,`تتغير طريقة التطبيق ودرجة المشاركة وسرعة القرار بحسب الخطر والوقت والخبرة وطبيعة المهمة، بينما تظل المبادئ ثابتة.`],
[1,`m`,`أي سؤال يُعد من أسئلة الإدارة الاستراتيجية؟`,[`من سيستقبل المجموعة غدًا في المطار؟`,`كم مقعدًا شاغرًا في رحلة اليوم؟`,`من هم عملاؤنا المستهدفون وما الخدمات التي نقدمها بصورة متميزة وكيف نستجيب للمنافسة؟`,`لماذا تأخر السائق اليوم؟`],2,`الاستراتيجية تهتم باتجاه المنشأة في المدى الأطول، ويظهر أثرها في اختيار الأسواق والمنتجات والاستثمارات.`],
[1,`m`,`في مثال تعذر الحافلة، أي ترتيب صحيح للأدوار المتتابعة للمدير؟`,[`التفاوض ثم جمع المعلومات ثم الاتصال ثم القرار ثم التعلم ثم المتابعة`,`جمع المعلومات ثم الاتصال ثم القرار ثم التفاوض ثم المتابعة ثم التعلم`,`القرار ثم جمع المعلومات ثم التفاوض ثم المتابعة ثم الاتصال ثم التعلم`,`جمع المعلومات ثم القرار وتوزيع الموارد ثم التفاوض ثم الاتصال ثم المتابعة ثم التعلم`],3,`يبدأ المدير بفهم الموقف ثم يقرر ويفاوض ويبلغ المرشد والعملاء ويتابع وصول البديل، وينتهي بالتعلم من سبب العطل.`],
[1,`t`,`ركزت المدرسة الكلاسيكية على وضوح العمل والسلطة والقواعد والرقابة.`,null,0,`ظهرت للحاجة إلى تنظيم المؤسسات الكبيرة ورفع الإنتاجية.`],
[1,`t`,`يعني مبدأ توازن السلطة والمسؤولية أن يُحمَّل الموظف نتيجة حتى لو لم يملك صلاحية التأثير فيها.`,null,1,`المبدأ يعني العكس: ألا نحمّل موظفًا نتيجة لا يملك صلاحية التأثير فيها.`],
[1,`t`,`تقوم الإدارة الرشيقة على إزالة الهدر وتحسين انسياب العمل دون إضعاف القيمة التي يحصل عليها العميل.`,null,0,`ولذلك يمكن حذف إدخال البيانات المكرر لكن لا تُحذف خطوة تحقق أساسية.`],
[1,`t`,`تُختبر فكرة البرنامج الجديد في إدارة الابتكار بإطلاقها مباشرة لكل العملاء دون تجربة مصغرة.`,null,1,`يمكن اختبارها مع مجموعة صغيرة وقياس الإقبال والتكلفة والرضا قبل التوسع.`],
[1,`t`,`قد يجمع شخص واحد أكثر من دور إداري في المنشأة الصغيرة.`,null,0,`ورد ذلك في تصنيف المديرين بحسب مجال المسؤولية.`],
[1,`t`,`المدير الوظيفي هو المسؤول عن نتائج المنشأة كلها.`,null,1,`ذلك المدير العام؛ أما الوظيفي فمسؤول عن مجال محدد كالتسويق أو المالية.`],
[1,`m`,`أي سؤال إداري يرتبط بمتغير «أدوات الذكاء الاصطناعي»؟`,[`كيف ندير الحجوزات والبيانات والعلاقة مع العميل عبر القنوات؟`,`هل تغيرت توقعات المسافر بشأن المرونة والمعلومات ونوع التجربة؟`,`أين تساعدنا هذه الأدوات في العمل، وكيف نتحقق من دقة مخرجاتها؟`,`كيف نرصد الأنماط المتكررة ونعالج أسبابها؟`],2,`الخيار الأول للتحول الرقمي والمنصات، والثاني لتغير سلوك المسافر، والرابع للتقييمات الإلكترونية.`],
[1,`m`,`أي مطابقة بين المتغير المؤثر والسؤال الإداري المرتبط به صحيحة؟`,[`نقص العمالة المؤهلة: ما الذي يميز خدماتنا لدى الشريحة المستهدفة؟`,`التغير المناخي: هل تتأثر مواعيد الأنشطة أو سلامة المواقع والمسارات؟`,`المنافسة واتساع السوق: كيف نستقطب العاملين وندربهم ونحتفظ بخبراتهم؟`,`التقييمات الإلكترونية: ما الخدمات الحرجة وما خطة الاتصال والبدائل؟`],1,`ينبغي ربط كل متغير بسؤال إداري، لا حفظ قائمة المتغيرات فقط.`],
[1,`m`,`يفقد القرار في موقف طارئ قيمته إذا تأخر. ما المهارة وضابطها اللذان يلزمان المدير؟`,[`ترتيب أولويات واضح وتصرف منظم وتفاوض مع الشركاء، دون إهمال سلامة الأشخاص أو تقديم معلومات غير مؤكدة`,`سرعة القرار وحدها حتى لو لم تتأكد المعلومات`,`انتظار الموافقات العليا دائمًا لضمان الدقة`,`تأجيل الاتصال بالعملاء حتى تنتهي الأزمة`],0,`تحتاج السياحة إلى ترتيب أولويات واضح لأن بعض القرارات تفقد قيمتها إذا تأخرت.`],
[1,`m`,`تريد منشأة فهم أسباب الصراع بين فريقين وتحسين الدافعية والرضا الوظيفي لدى العاملين. أي مدرسة يتوافق اهتمامها مع ذلك؟`,[`الإدارة العلمية`,`التنظيم البيروقراطي`,`المدرسة السلوكية`,`المبادئ الإدارية`],2,`توسعت السلوكية في دراسة سلوك الأفراد والجماعات: الدافعية والرضا والقيادة والاتصال وفرق العمل والصراع واتخاذ القرار.`],
[1,`m`,`أي مبدأ يخص «توزيع المهام وفق التخصص»، وأيها يخص «معرفة الموظف رئيسه المباشر»، بالترتيب؟`,[`وحدة الأمر ثم تقسيم العمل`,`تقسيم العمل ثم الانضباط`,`العدالة ثم التنسيق`,`تقسيم العمل ثم وحدة الأمر`],3,`تقسيم العمل يعني توزيع المهام وفق التخصص، ووحدة الأمر تعني معرفة الرئيس المباشر ومن يملك إصدار التعليمات الملزمة.`],
[1,`m`,`لماذا تظهر أهمية مدرسة العلاقات الإنسانية بوضوح في المنشآت السياحية؟`,[`لأن العاملين يتواصلون مع العملاء مباشرة، فتظهر حالة الفريق وتعاونه في سرعة الاستجابة وطريقة الحديث والاستعداد لبذل جهد إضافي`,`لأن العلاقات اللطيفة تغني عن قياس النتائج`,`لأن المنشآت السياحية لا تحتاج إلى قواعد`,`لأن الموظف مجرد منفذ للتعليمات`],0,`مع ذلك لا يعني الاهتمام بالعلاقات تجاهل النتائج.`],
[1,`t`,`تهتم إدارة المعرفة بجمع خبرات العاملين وتنظيمها وإتاحتها لمن يحتاجها حتى لا تضيع بغياب أحدهم.`,null,0,`مثل توثيق تجربة مرشد خبير وتدريب بقية الفريق عليها.`],
[1,`t`,`ينظر مدخل النظم إلى أجزاء المنشأة منفصلة، دون اعتبار لتبادل الموارد والمعلومات مع البيئة المحيطة.`,null,1,`ينظر إليها كمجموعة أجزاء مترابطة تتبادل الموارد والمعلومات مع البيئة.`],
[1,`t`,`مشرف الرحلات الذي يعالج التأخير ويوزع المهام أثناء العمل ينتمي إلى الإدارة الوسطى.`,null,1,`ينتمي إلى الإدارة الإشرافية التي تتابع التنفيذ اليومي والعاملين الذين يقدمون الخدمة مباشرة.`],
[1,`t`,`تشمل المهارات الفكرية والتحليلية رؤية العلاقات بين الأجزاء وتفسير البيانات وتحديد السبب الحقيقي للمشكلة ومقارنة البدائل.`,null,0,`هذا هو تعريفها في المحاضرة.`]
];
Q.sort((a,b)=>a[0]-b[0]||(a[1]==="m"?0:1)-(b[1]==="m"?0:1));
const N=Q.length,A=Array(N).fill(null),$=s=>document.querySelector(s),LT="أبجد",C=2*Math.PI*26;
$("#fg").setAttribute("stroke-dasharray",C);
let h="";
Q.forEach((q,i)=>{
 if(!i)h+=`<h2>${L[q[0]]}</h2>`;else if(Q[i-1][0]!==q[0])h+=`<div class="sep"><span>الأسئلة التالية على المحاضرة الثانية: ${L[q[0]].split(": ")[1]}</span></div>`;
 const o=q[3]||["صح","خطأ"];
 h+=`<div class="q" id="q${i}"><div class="meta">سؤال ${i+1} من ${N} · ${q[1]==="m"?"اختيار من متعدد":"صح أم خطأ"}</div><div class="qt">${q[2]}</div>`+
 o.map((t,j)=>`<button class="op" type="button" data-i="${i}" data-j="${j}">${q[3]?`<b>${LT[j]}.</b>`:""}<span>${t}</span></button>`).join("")+`<div class="fb"></div></div>`;
});
$("#qs").innerHTML=h;
$("#qs").addEventListener("click",e=>{const b=e.target.closest(".op");if(b)pick(+b.dataset.i,+b.dataset.j)});
function pick(i,j){
 if(A[i]!==null)return;A[i]=j;
 const q=Q[i],c=$("#q"+i),o=q[3]||["صح","خطأ"],f=c.querySelector(".fb");
 c.querySelectorAll(".op").forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add("ok");else if(k===j)b.classList.add("no")});
 if(j===q[4]){f.className="fb ok";f.textContent="✓ إجابة صحيحة"}
 else{f.className="fb no";f.innerHTML=`<strong>✗ إجابة خاطئة.</strong> الإجابة الصحيحة: <strong>${o[q[4]]}</strong><br>${q[5]}`}
 upd();
}
function upd(){
 const ok=A.filter((a,i)=>a===Q[i][4]).length,done=A.filter(a=>a!==null).length;
 $("#sc").textContent=ok+" / "+N;$("#rt").textContent=Math.round(ok/N*100)+"%";
 $("#fg").style.strokeDashoffset=C*(1-ok/N);$("#wn").textContent=N-ok;
 $("#st").textContent=done===N?`انتهى الاختبار: نتيجتك ${ok} من ${N}`:`أجبتَ عن ${done} من ${N}`;
}
$("#wbox").onclick=()=>{
 const l=Q.map((q,i)=>i).filter(i=>A[i]!==Q[i][4]);
 $("#wl").innerHTML=l.length?l.map(i=>`<button class="it" type="button" data-go="${i}"><span class="tag ${A[i]===null?"m":""}">${A[i]===null?"لم تُجَب":"خطأ"}</span>س${i+1}: ${Q[i][2].slice(0,70)}${Q[i][2].length>70?"…":""}</button>`).join(""):"لا توجد أسئلة خاطئة أو فائتة 🎉";
 $("#ov").classList.add("on");
};
const close=()=>$("#ov").classList.remove("on");
$("#cl").onclick=close;$("#ov").onclick=e=>{if(e.target.id==="ov")close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#wl").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;close();
 const c=$("#q"+b.dataset.go);c.scrollIntoView({behavior:"smooth",block:"start"});
 c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash");
});
upd();
</script>
